name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# One build per branch at a time; a newer push waits instead of cancelling,
# so every finished run has its installer and APK attached.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Test
        working-directory: desktop
        # A private session bus for the Linux music detection test.
        run: dbus-run-session -- cargo test -p osctool-core

  desktop:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Check frontend
        working-directory: desktop
        run: npm run check
      - name: Build installer
        working-directory: desktop
        run: npx tauri build
      - uses: actions/upload-artifact@v6
        with:
          name: osc-tool-vrc-windows
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/osc-tool-vrc.exe
          if-no-files-found: error

  linux:
    name: Linux app
    # The oldest supported runner, so the AppImage runs on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Build packages
        working-directory: desktop
        run: npx tauri build --bundles deb,rpm,appimage
      - uses: actions/upload-artifact@v6
        with:
          name: osc-tool-vrc-linux
          path: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/rpm/*.rpm
            desktop/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  watch:
    name: Watch app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build APK
        working-directory: watch
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v6
        with:
          name: osc-tool-vrc-watch
          path: watch/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
