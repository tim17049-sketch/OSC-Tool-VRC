name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Test
        working-directory: desktop
        run: cargo test -p osctool-core

  desktop:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Check frontend
        working-directory: desktop
        run: npm run check
      - name: Build installer
        working-directory: desktop
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: osc-tool-vrc-windows
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/osc-tool-vrc.exe
          if-no-files-found: error

  watch:
    name: Watch app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: watch
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: osc-tool-vrc-watch
          path: watch/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
